<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <title>User Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>User Dashboard</h1>

    <div sec:authorize="isAuthenticated()">
        <div class="card">
            <div class="card-header">
                User Information
            </div>
            <div class="card-body">
                <p><strong>Username:</strong> <span sec:authentication="name"></span></p>
                <p><strong>Roles:</strong> <span sec:authentication="principal.authorities"></span></p>

                <div sec:authorize="hasRole('ADMIN')">
                    <div class="alert alert-warning">
                        You have ADMIN privileges
                    </div>
                </div>
            </div>
        </div>

        <a th:href="@{/}" class="btn btn-secondary mt-3">Back to Home</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-danger mt-3 ms-2">Logout</button>
        </form>
    </div>
</div>
</body>
</html>
