<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .super-user {
            background-color: #fff8e6;
        }
        .action-buttons {
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Admin Panel</h1>
        <a th:href="@{/logout}" class="btn btn-outline-danger">Logout</a>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div sec:authorize="hasRole('ADMIN')">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>User Management</h3>
            <a th:href="@{/admin/new}" class="btn btn-primary">Add New User</a>
        </div>

        <table class="table table-striped">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Roles</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}"
                th:class="${user.username == 'Super'} ? 'super-user' : ''">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td>
                        <span th:each="role, stat : ${user.roles}">
                            <span th:text="${role.name}"></span>
                            <span th:if="${!stat.last}">, </span>
                        </span>
                </td>
                <td class="action-buttons">
                    <a th:if="${user.username != 'Super'}"
                       th:href="@{/admin/edit/{id}(id=${user.id})}"
                       class="btn btn-sm btn-warning me-2">Edit</a>

                    <a th:if="${user.username != 'Super'}"
                       th:href="@{/admin/delete/{id}(id=${user.id})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete this user?')">Delete</a>

                    <span th:if="${user.username == 'Super'}"
                          class="text-muted">(Read Only)</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
