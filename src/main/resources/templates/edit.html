<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<form th:action="@{/admin/{id}(id=${user.id})}"th:object="${user}" method="post" class="form-example">
  <input type="hidden" th:field="*{id}">
  <div class="form-example">
    <label for="name">Enter your name: </label>
    <input type="text" th:field="*{username}" id="name" required />
  </div>
  <div class="form-example">
    <label for="password">Enter your password: </label>
    <input type="password" th:field="*{password}" id="email" required />
  </div>
  <div class="form-example">
    <label for="enabled">Enter your enabled: </label>
    <input type="checkbox" th:field="*{enabled}" id="password" required />
  </div>
  <div class="form-example">
    <label for="roles">Enter your roles: </label>
    <select th:field="*{roles}">
      <option th:each="r:${roles}" th:value="${r.id}"th:text="${r.name}">
        role
      </option>
    </select>
  </div>
  <div class="form-example">
    <input type="submit" value="Subscribe!" />
  </div>
</form>
</body>
</html>
